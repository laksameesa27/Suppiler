<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Data Dashboard</title>
    <!-- ใช้ Tailwind CSS สำหรับตกแต่ง UI ให้สวยงามและรองรับ Mobile -->
    <script src="https://tailwindcss.com"></script>
    <!-- ใช้ Lucide Icons สำหรับไอคอนประกอบ -->
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i data-lucide="database" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Supplier Data Dashboard</h1>
                    <p class="text-xs text-slate-500">ระบบบริหารจัดการข้อมูลคู่ค้าสำรอง</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm bg-blue-50 text-blue-700 px-3 py-1 rounded-full font-medium">
                    ทั้งหมด <span id="total-count">0</span> รายชื่อ
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">
        
        <!-- Left Sidebar: Filters -->
        <aside class="w-full md:w-64 bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <h2 class="font-semibold text-slate-900 flex items-center gap-2">
                    <i data-lucide="filter" class="w-4 h-4 text-slate-500"></i> ตัวกรองข้อมูล
                </h2>
                <button onclick="clearFilters()" class="text-xs text-blue-600 hover:underline">ล้างทั้งหมด</button>
            </div>
            
            <!-- Category Filter -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">หมวดหมู่ธุรกิจ</label>
                <div class="space-y-2" id="category-filters">
                    <!-- จะถูก Render ด้วย JavaScript -->
                </div>
            </div>
        </aside>

        <!-- Right Content: Search & Grid List -->
        <section class="flex-1 space-y-6">
            
            <!-- Search Bar Component -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                    <input 
                        type="text" 
                        id="search-input"
                        placeholder="ค้นหาชื่อคู่ค้า, สินค้าหลัก หรือคีย์เวิร์ด..." 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all"
                        oninput="filterSuppliers()"
                    >
                </div>
            </div>

            <!-- Supplier Grid List -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" id="supplier-grid">
                <!-- Data Cards จะถูกเติมด้วย JavaScript -->
            </div>

            <!-- Empty State (กรณีค้นหาไม่เจอ) -->
            <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200 border-dashed">
                <i data-lucide="folder-open" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                <p class="text-slate-500 font-medium">ไม่พบข้อมูลคู่ค้าที่ตรงกับเงื่อนไข</p>
                <p class="text-xs text-slate-400 mt-1">ลองเปลี่ยนคำค้นหา หรือเลือกหมวดหมู่อื่น</p>
            </div>

        </section>
    </main>

    <!-- JavaScript ลอจิกการจำลองข้อมูลและการทำงาน (Mock Data & Logic) -->
    <script>
        // 1. จำลองฐานข้อมูลคู่ค้าที่ไหลมาจากระบบ Email & Form
        const mockSuppliers = [
            {
                id: 1,
                nameTH: "บริษัท ไอยรา เทคโนโลยี จำกัด",
                nameEN: "Aiyara Technology Co., Ltd.",
                contact: "คุณสมชาย ดีใจ",
                phone: "081-234-5678",
                email: "somchai@aiyara.io",
                category: "IT & Software",
                summary: "รับพัฒนาซอฟต์แวร์ระบบคลาวด์, จัดหาอุปกรณ์คอมพิวเตอร์สำนักงาน และระบบรักษาความปลอดภัยเครือข่าย",
                regDate: "2026-10-25"
            },
            {
                id: 2,
                nameTH: "ห้างหุ้นส่วนจำกัด วรจักร สเตชันเนอรี่",
                nameEN: "Worachak Stationery Partnership",
                contact: "คุณวิภา ศรีสวย",
                phone: "02-987-6543",
                email: "sales@worachak.com",
                category: "Office Supplies",
                summary: "จำหน่ายเครื่องเขียน อุปกรณ์สำนักงาน กระดาษดับเบิ้ลเอ และหมึกพิมพ์แท้ราคาส่ง พร้อมจัดส่งทั่วกรุงเทพฯ",
                regDate: "2026-10-22"
            },
            {
                id: 3,
                nameTH: "บริษัท พีพี คอนสตรัคชั่น แอนด์ ดีไซน์ จำกัด",
                nameEN: "PP Construction & Design Co., Ltd.",
                contact: "คุณประเสริฐ ยิ่งใหญ่",
                phone: "089-777-8899",
                email: "project@ppconstruct.co.th",
                category: "Construction & Renovation",
                summary: "รับเหมาก่อสร้าง ปรับปรุงอาคารสำนักงาน เทพื้นคอนกรีต งานเดินสายไฟแรงสูง และงานทาสีอาคาร",
                regDate: "2026-10-20"
            },
            {
                id: 4,
                nameTH: "บริษัท มีเดีย พลัส โซลูชั่น จำกัด",
                nameEN: "Media Plus Solution Co., Ltd.",
                contact: "คุณอนันต์ รักดี",
                phone: "086-555-1234",
                email: "contact@mediaplus.agency",
                category: "Marketing & Media",
                summary: "เอเจนซี่รับทำสื่อโฆษณาออนไลน์ ผลิตวิดีโอพรีเซนต์องค์กร จัดทำของพรีเมียมสกรีนโลโก้บริษัท",
                regDate: "2026-10-18"
            }
        ];

        // ดึงหมวดหมู่ทั้งหมดแบบ Unique
        const categories = [...new Set(mockSuppliers.map(s => s.category))];

        // 2. เริ่มต้นติดตั้งหน้าเว็บ
        document.addEventListener("DOMContentLoaded", () => {
            renderFilters();
            renderSuppliers(mockSuppliers);
            // แสดงไอคอนทั้งหมด
            lucide.createIcons();
        });

        // 3. ฟังก์ชัน Render เมนูตัวกรองด้านข้าง
        function renderFilters() {
            const filterContainer = document.getElementById("category-filters");
            filterContainer.innerHTML = categories.map(cat => `
                <label class="flex items-center gap-2 text-sm text-slate-600 hover:text-slate-900 cursor-pointer">
                    <input type="checkbox" value="${cat}" onchange="filterSuppliers()" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4 border-slate-300">
                    <span>${cat}</span>
                </label>
            `).join('');
        }

        // 4. ฟังก์ชัน Render การ์ดรายชื่อคู่ค้า
        function renderSuppliers(data) {
            const grid = document.getElementById("supplier-grid");
            const emptyState = document.getElementById("empty-state");
            document.getElementById("total-count").innerText = data.length;

            if (data.length === 0) {
                grid.innerHTML = "";
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");

            grid.innerHTML = data.map(item => `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                    <div>
                        <!-- Header Card -->
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-xs font-medium px-2.5 py-1 rounded-md bg-blue-50 text-blue-700 border border-blue-100">
                                ${item.category}
                            </span>
                            <span class="text-[11px] text-slate-400">ลงทะเบียน: ${item.regDate}</span>
                        </div>
                        
                        <!-- Company Names -->
                        <h3 class="font-bold text-slate-900 text-base leading-snug">${item.nameTH}</h3>
                        <p class="text-xs text-slate-400 font-medium mb-3">${item.nameEN}</p>
                        
                        <!-- Summary / Keywords -->
                        <p class="text-sm text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-100 mb-4 line-clamp-2">
                            ${item.summary}
                        </p>
                    </div>

                    <!-- Contact Details & Action -->
                    <div class="border-t border-slate-100 pt-3 mt-auto space-y-2">
                        <div class="grid grid-cols-2 gap-2 text-xs text-slate-500">
                            <div class="flex items-center gap-1.5 truncate">
                                <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                                <span>${item.contact}</span>
                            </div>
                            <div class="flex items-center gap-1.5 truncate">
                                <i data-lucide="phone" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>
                                <span>${item.phone}</span>
                            </div>
                        </div>
